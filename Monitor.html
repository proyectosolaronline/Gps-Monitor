<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Flotilla GPS Pro — Monitor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0b1420; --panel:#101c2c; --panel-alt:#16263a; --line:#223449;
    --text:#e8eef5; --text-dim:#8ea3b8; --accent:#35c2a4; --warn:#e0a53c; --danger:#e05a4e;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }

  #app{ display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

  /* ===== HEADER ===== */
  header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;
    padding: 8px 12px; border-bottom:1px solid var(--line); background: var(--panel);
    min-height: 52px;
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(53,194,164,0.15); }
  .brand h1{ font-size:14px; margin:0; font-weight:600; }

  nav{ display:flex; gap:6px; align-items:center; flex-wrap: wrap; }
  nav a, nav button{
    text-decoration:none; color:var(--text); background: transparent; border:1px solid var(--line);
    padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  nav a:hover, nav button:hover{ border-color: var(--accent); color: var(--accent); }
  #badgeUsuario{ font-size:11px; color: var(--text-dim); margin-right:4px; }

  /* ===== MAIN ===== */
  main{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }

  #mapa{ flex:1; width:100%; height:100%; z-index:1; }

  /* ===== SIDEBAR / PANEL INFERIOR ===== */
  aside{
    width:100%; max-height:45vh; background: var(--panel);
    border-top:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden;
    transition: max-height 0.3s ease; z-index:10;
    position: relative;
  }
  aside.colapsado{ max-height: 0; border-top:none; }

  .aside-tabs{ display:flex; border-bottom:1px solid var(--line); background:var(--panel-alt); flex-shrink:0; }
  .aside-tabs button{
    flex:1; background:none; border:none; color: var(--text-dim); padding:10px; font-size:12.5px;
    font-weight:600; cursor:pointer; border-bottom:2px solid transparent; transition:0.2s;
  }
  .aside-tabs button.activo{ color: var(--accent); border-bottom-color: var(--accent); background: rgba(53,194,164,0.05); }

  .panel-lista{ flex:1; overflow-y:auto; padding:10px; display:none; -webkit-overflow-scrolling:touch; }
  .panel-lista.activo{ display:block; }

  /* ===== BOTÓN PARA DESPLEGAR/OCULTAR PANEL ===== */
  .toggle-panel{
    position:absolute; top:-28px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--line); border-bottom:none;
    color:var(--text-dim); padding:4px 16px; border-radius:12px 12px 0 0;
    font-size:18px; cursor:pointer; z-index:20; line-height:1.2;
    box-shadow:0 -2px 8px rgba(0,0,0,0.4);
  }
  .toggle-panel:hover{ color:var(--accent); }

  /* ===== ITEMS ===== */
  .item-vehiculo{
    background: var(--panel-alt); border:1px solid var(--line); border-radius:10px;
    padding: 12px 14px; margin-bottom:8px; cursor:pointer; transition:0.15s;
  }
  .item-vehiculo:active{ transform:scale(0.98); background:var(--panel); }
  .item-vehiculo .nombre{ font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .item-vehiculo .meta{ font-size:12px; color: var(--text-dim); margin-top:4px; display:flex; justify-content:space-between; }
  .estado-punto{ display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .estado-punto.activo{ background: var(--accent); }
  .estado-punto.detenido{ background: var(--warn); }
  .estado-punto.averia{ background: var(--danger); }

  .item-alerta{
    background: rgba(224,90,78,0.08); border:1px solid rgba(224,90,78,0.25); border-radius:10px;
    padding: 12px 14px; margin-bottom:8px;
  }
  .item-alerta.atendida{ opacity:0.5; border-color:var(--line); background:var(--panel-alt); }
  .item-alerta .tipo{ font-size:11px; font-weight:700; color: var(--danger); text-transform:uppercase; letter-spacing:0.4px; }
  .item-alerta .nombre{ font-size:14px; margin-top:4px; font-weight:500; }
  .item-alerta .msg{ font-size:12px; color: var(--text-dim); margin-top:3px; }
  .item-alerta button{
    margin-top:10px; font-size:13px; width:100%; background: rgba(53,194,164,0.15); color: var(--accent);
    border:1px solid rgba(53,194,164,0.3); border-radius:8px; padding:10px; cursor:pointer; font-weight:600;
  }
  .item-alerta button:active{ background:rgba(53,194,164,0.25); }

  .vacio{ text-align:center; color: var(--text-dim); font-size:13px; padding: 40px 10px; }

  /* ===== RESPONSIVE (escritorio) ===== */
  @media (min-width: 820px) {
    main{ flex-direction:row; }
    aside{
      width:340px; min-width:280px; max-height:100%; border-top:none; border-left:1px solid var(--line);
    }
    .toggle-panel{ display:none; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand"><div class="dot"></div><h1>Monitor de Flotilla</h1></div>
    <nav>
      <span id="badgeUsuario"></span>
      <a href="Chat.html">Chat</a>
      <a href="Admin.html" id="linkAdmin" style="display:none;">Usuarios</a>
      <button onclick="FlotillaAuth.cerrarSesion()">Salir</button>
    </nav>
  </header>

  <main>
    <div id="mapa"></div>
    <aside id="panelLateral">
      <button class="toggle-panel" id="btnTogglePanel" aria-label="Ocultar/Mostrar panel">⌃</button>
      <div class="aside-tabs">
        <button class="activo" data-tab="vehiculos">🚛 Flotilla</button>
        <button data-tab="alertas">⚠️ Alertas <span id="contAlertas"></span></button>
      </div>
      <div class="panel-lista activo" id="panelVehiculos">
        <div class="vacio">Cargando flotilla...</div>
      </div>
      <div class="panel-lista" id="panelAlertas">
        <div class="vacio">Cargando alertas...</div>
      </div>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="auth.js"></script>
<script>
  let mapa, marcadores = {};
  let panelColapsado = false;

  // ===== AUTENTICACIÓN =====
  FlotillaAuth.proteger({ roles: ['admin', 'dispatcher'] }).then(function (usuario) {
    document.getElementById('badgeUsuario').textContent = usuario.Nombre + ' · ' + usuario.Rol;
    if (usuario.Rol === 'admin') document.getElementById('linkAdmin').style.display = 'inline-block';

    iniciarMapa();
    cargarFlotilla();
    cargarAlertas();

    setInterval(cargarFlotilla, 5000);
    setInterval(cargarAlertas, 8000);
  });

  // ===== MAPA =====
  function iniciarMapa() {
    mapa = L.map('mapa').setView([31.8667, -116.5964], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);
  }

  function iconoPorEstado(estado) {
    const color = estado === 'averia' ? '#e05a4e' : estado === 'detenido' ? '#e0a53c' : '#35c2a4';
    return L.divIcon({
      className: '',
      html: '<div style="width:18px;height:18px;border-radius:50%;background:' + color + ';border:2px solid #0b1420;box-shadow:0 0 0 3px ' + color + '55;"></div>',
      iconSize: [18, 18]
    });
  }

  // ===== VEHÍCULOS =====
  function cargarFlotilla() {
    FlotillaAuth.llamarGet('listarFlotilla').then(function (res) {
      if (!res.exito) return;
      renderizarVehiculos(res.datos);
      actualizarMarcadores(res.datos);
    });
  }

  function renderizarVehiculos(lista) {
    const panel = document.getElementById('panelVehiculos');
    if (!lista.length) {
      panel.innerHTML = '<div class="vacio">📡 No hay vehículos activos.</div>';
      return;
    }
    panel.innerHTML = lista.map(function (v) {
      const hace = tiempoRelativo(v.Timestamp);
      return '<div class="item-vehiculo" onclick="centrarEn(' + v.Lat + ',' + v.Lng + ')">' +
        '<div class="nombre"><span class="estado-punto ' + v.Estado + '"></span>' + escapeHtml(v.Nombre) + '</div>' +
        '<div class="meta"><span>' + Math.round(v.Velocidad || 0) + ' km/h</span><span>' + hace + '</span></div></div>';
    }).join('');
  }

  function actualizarMarcadores(lista) {
    lista.forEach(function (v) {
      if (!v.Lat || !v.Lng) return;
      if (marcadores[v.UsuarioID]) {
        marcadores[v.UsuarioID].setLatLng([v.Lat, v.Lng]);
        marcadores[v.UsuarioID].setIcon(iconoPorEstado(v.Estado));
      } else {
        marcadores[v.UsuarioID] = L.marker([v.Lat, v.Lng], { icon: iconoPorEstado(v.Estado) })
          .addTo(mapa)
          .bindPopup('<strong>' + escapeHtml(v.Nombre) + '</strong>');
      }
    });
  }

  function centrarEn(lat, lng) {
    mapa.setView([lat, lng], 15);
    if (window.innerWidth < 820 && panelColapsado) {
      alternarPanel();
    }
  }

  // ===== ALERTAS =====
  function cargarAlertas() {
    FlotillaAuth.llamarGet('listarAlertas').then(function (res) {
      if (!res.exito) return;
      renderizarAlertas(res.datos);
    });
  }

  function renderizarAlertas(lista) {
    const panel = document.getElementById('panelAlertas');
    const pendientes = lista.filter(function (a) { return !a.Atendida; });
    document.getElementById('contAlertas').textContent = pendientes.length ? '(' + pendientes.length + ')' : '';

    if (!lista.length) {
      panel.innerHTML = '<div class="vacio">✅ Sin alertas registradas.</div>';
      return;
    }

    panel.innerHTML = lista.slice(0, 30).map(function (a) {
      return '<div class="item-alerta ' + (a.Atendida ? 'atendida' : '') + '">' +
        '<div class="tipo">' + escapeHtml(a.Tipo) + '</div>' +
        '<div class="nombre">' + escapeHtml(a.Nombre) + '</div>' +
        (a.Mensaje ? '<div class="msg">' + escapeHtml(a.Mensaje) + '</div>' : '') +
        '<div class="meta" style="font-size:11px;color:#8ea3b8;margin-top:3px;">' + tiempoRelativo(a.Timestamp) + '</div>' +
        (!a.Atendida ? '<button onclick="atender(\'' + a.ID + '\')">✅ Marcar atendida</button>' : '') +
        '</div>';
    }).join('');
  }

  function atender(id) {
    FlotillaAuth.llamar('atenderAlerta', { id: id }).then(function () { cargarAlertas(); });
  }

  // ===== PANEL MÓVIL (colapsable) =====
  function alternarPanel() {
    const aside = document.getElementById('panelLateral');
    const btn = document.getElementById('btnTogglePanel');
    panelColapsado = !panelColapsado;
    aside.classList.toggle('colapsado');
    btn.textContent = panelColapsado ? '⌄' : '⌃';
    setTimeout(() => mapa.invalidateSize(), 350);
  }

  document.getElementById('btnTogglePanel').addEventListener('click', alternarPanel);

  // ===== TABS =====
  document.querySelectorAll('.aside-tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.aside-tabs button').forEach(function (b) { b.classList.remove('activo'); });
      document.querySelectorAll('.panel-lista').forEach(function (p) { p.classList.remove('activo'); });
      btn.classList.add('activo');
      document.getElementById('panel' + (btn.dataset.tab === 'vehiculos' ? 'Vehiculos' : 'Alertas')).classList.add('activo');
      if (window.innerWidth < 820 && panelColapsado) alternarPanel();
    });
  });

  // ===== UTILIDADES =====
  function tiempoRelativo(fechaStr) {
    const diffSeg = Math.floor((Date.now() - new Date(fechaStr).getTime()) / 1000);
    if (diffSeg < 60) return 'hace ' + diffSeg + 's';
    if (diffSeg < 3600) return 'hace ' + Math.floor(diffSeg / 60) + 'min';
    return 'hace ' + Math.floor(diffSeg / 3600) + 'h';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
