<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flotilla GPS Pro — Chat</title>
<style>
  :root{
    --bg:#0b1420; --panel:#101c2c; --panel-alt:#16263a; --line:#223449;
    --text:#e8eef5; --text-dim:#8ea3b8; --accent:#35c2a4;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,-apple-system,sans-serif; }

  #app{ display:flex; flex-direction:column; height:100vh; max-width: 720px; margin: 0 auto; }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding: 12px 16px; border-bottom:1px solid var(--line); background: var(--panel);
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(53,194,164,0.15); }
  .brand h1{ font-size:14px; margin:0; }
  nav{ display:flex; gap:8px; }
  nav a, nav button{
    text-decoration:none; color:var(--text); background:transparent; border:1px solid var(--line);
    padding:7px 12px; border-radius:7px; font-size:12px; cursor:pointer;
  }

  #mensajes{ flex:1; overflow-y:auto; padding: 16px; display:flex; flex-direction:column; gap:10px; }

  .msg{ max-width: 78%; }
  .msg .autor{ font-size:11px; color: var(--text-dim); margin-bottom:3px; }
  .msg .burbuja{
    background: var(--panel-alt); border:1px solid var(--line); border-radius: 12px 12px 12px 4px;
    padding: 9px 13px; font-size:13.5px; line-height:1.4; word-wrap: break-word;
  }
  .msg.propio{ align-self: flex-end; }
  .msg.propio .autor{ text-align:right; }
  .msg.propio .burbuja{
    background: rgba(53,194,164,0.15); border-color: rgba(53,194,164,0.3);
    border-radius: 12px 12px 4px 12px;
  }
  .hora{ font-size:10px; color: var(--text-dim); margin-top:3px; }

  form#formEnviar{
    display:flex; gap:8px; padding: 12px 16px; border-top:1px solid var(--line); background: var(--panel);
  }
  form#formEnviar input{
    flex:1; background:#0d1826; border:1px solid var(--line); color: var(--text);
    padding: 11px 14px; border-radius: 20px; font-size:13.5px; outline:none;
  }
  form#formEnviar input:focus{ border-color: var(--accent); }
  form#formEnviar button{
    background: var(--accent); color:#04211a; border:none; padding: 0 20px; border-radius: 20px;
    font-size:13px; font-weight:700; cursor:pointer;
  }

  .vacio{ text-align:center; color: var(--text-dim); font-size:12.5px; margin-top: 30px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand"><div class="dot"></div><h1>Chat global de la flotilla</h1></div>
    <nav>
      <a href="javascript:history.back()">Volver</a>
      <button onclick="FlotillaAuth.cerrarSesion()">Salir</button>
    </nav>
  </header>

  <div id="mensajes"><div class="vacio">Cargando mensajes...</div></div>

  <form id="formEnviar">
    <input type="text" id="campoMensaje" placeholder="Escribe un mensaje..." autocomplete="off" required maxlength="500">
    <button type="submit">Enviar</button>
  </form>
</div>

<script src="auth.js"></script>
<script>
  let usuarioActual = null;
  let ultimoTimestamp = null;

  FlotillaAuth.proteger().then(function (usuario) {
    usuarioActual = usuario;
    cargarMensajes(true);
    setInterval(function () { cargarMensajes(false); }, 3000);
  });

  function cargarMensajes(reemplazarTodo) {
    const parametros = {};
    if (!reemplazarTodo && ultimoTimestamp) parametros.desde = ultimoTimestamp;

    FlotillaAuth.llamarGet('listarMensajes', parametros).then(function (res) {
      if (!res.exito) return;
      if (!res.datos.length && reemplazarTodo) {
        document.getElementById('mensajes').innerHTML = '<div class="vacio">Aún no hay mensajes. ¡Sé el primero en escribir!</div>';
        return;
      }
      if (!res.datos.length) return;

      if (reemplazarTodo) {
        renderizarMensajes(res.datos);
      } else {
        agregarMensajes(res.datos);
      }

      ultimoTimestamp = res.datos[res.datos.length - 1].Timestamp;
    });
  }

  function renderizarMensajes(lista) {
    const cont = document.getElementById('mensajes');
    cont.innerHTML = '';
    lista.forEach(function (m) { cont.appendChild(crearBurbuja(m)); });
    cont.scrollTop = cont.scrollHeight;
  }

  function agregarMensajes(lista) {
    const cont = document.getElementById('mensajes');
    const vacio = cont.querySelector('.vacio');
    if (vacio) cont.innerHTML = '';
    lista.forEach(function (m) { cont.appendChild(crearBurbuja(m)); });
    cont.scrollTop = cont.scrollHeight;
  }

  function crearBurbuja(m) {
    const esPropio = usuarioActual && m.UsuarioID === usuarioActual.ID;
    const div = document.createElement('div');
    div.className = 'msg' + (esPropio ? ' propio' : '');
    const hora = new Date(m.Timestamp).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    div.innerHTML =
      '<div class="autor">' + escapeHtml(m.Nombre) + '</div>' +
      '<div class="burbuja">' + escapeHtml(m.Mensaje) + '</div>' +
      '<div class="hora">' + hora + '</div>';
    return div;
  }

  document.getElementById('formEnviar').addEventListener('submit', function (e) {
    e.preventDefault();
    const campo = document.getElementById('campoMensaje');
    const texto = campo.value.trim();
    if (!texto) return;

    campo.value = '';
    FlotillaAuth.llamar('enviarMensaje', { mensaje: texto }).then(function (res) {
      if (res.exito) cargarMensajes(false);
    });
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
