<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flotilla GPS Pro — Monitor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0b1420; --panel:#101c2c; --panel-alt:#16263a; --line:#223449;
    --text:#e8eef5; --text-dim:#8ea3b8; --accent:#35c2a4; --warn:#e0a53c; --danger:#e05a4e;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,-apple-system,sans-serif; }

  #app{ display:flex; flex-direction:column; height:100vh; }

  header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding: 12px 18px; border-bottom:1px solid var(--line); background: var(--panel);
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(53,194,164,0.15); }
  .brand h1{ font-size:15px; margin:0; }
  nav{ display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
  nav a, nav button{
    text-decoration:none; color:var(--text); background: transparent; border:1px solid var(--line);
    padding:7px 13px; border-radius:7px; font-size:12.5px; cursor:pointer;
  }
  nav a:hover, nav button:hover{ border-color: var(--accent); color: var(--accent); }
  #badgeUsuario{ font-size:12px; color: var(--text-dim); margin-right:4px; }

  main{ flex:1; display:flex; min-height:0; }
  #mapa{ flex:1; }

  aside{
    width: 320px; min-width:280px; background: var(--panel);
    border-left:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden;
  }
  .aside-tabs{ display:flex; border-bottom:1px solid var(--line); }
  .aside-tabs button{
    flex:1; background:none; border:none; color: var(--text-dim); padding:12px; font-size:12.5px;
    font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
  }
  .aside-tabs button.activo{ color: var(--accent); border-bottom-color: var(--accent); }

  .panel-lista{ flex:1; overflow-y:auto; padding: 10px; display:none; }
  .panel-lista.activo{ display:block; }

  .item-vehiculo{
    background: var(--panel-alt); border:1px solid var(--line); border-radius:9px;
    padding: 10px 12px; margin-bottom: 8px; cursor:pointer;
  }
  .item-vehiculo:hover{ border-color: var(--accent); }
  .item-vehiculo .nombre{ font-size:13px; font-weight:600; }
  .item-vehiculo .meta{ font-size:11px; color: var(--text-dim); margin-top:3px; }
  .estado-punto{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .estado-punto.activo{ background: var(--accent); }
  .estado-punto.detenido{ background: var(--warn); }
  .estado-punto.averia{ background: var(--danger); }

  .item-alerta{
    background: rgba(224,90,78,0.08); border:1px solid rgba(224,90,78,0.3); border-radius:9px;
    padding: 10px 12px; margin-bottom:8px;
  }
  .item-alerta.atendida{ opacity:0.5; }
  .item-alerta .tipo{ font-size:11px; font-weight:700; color: var(--danger); text-transform:uppercase; letter-spacing:0.4px; }
  .item-alerta .nombre{ font-size:13px; margin-top:4px; }
  .item-alerta .msg{ font-size:12px; color: var(--text-dim); margin-top:3px; }
  .item-alerta button{
    margin-top:8px; font-size:11px; background: rgba(53,194,164,0.15); color: var(--accent);
    border:1px solid rgba(53,194,164,0.3); border-radius:6px; padding:5px 10px; cursor:pointer;
  }

  .vacio{ text-align:center; color: var(--text-dim); font-size:12.5px; padding: 30px 10px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand"><div class="dot"></div><h1>Monitor de Flotilla</h1></div>
    <nav>
      <span id="badgeUsuario"></span>
      <a href="Chat.html">Chat</a>
      <a href="Admin.html" id="linkAdmin" style="display:none;">Usuarios</a>
      <button onclick="FlotillaAuth.cerrarSesion()">Salir</button>
    </nav>
  </header>

  <main>
    <div id="mapa"></div>
    <aside>
      <div class="aside-tabs">
        <button class="activo" data-tab="vehiculos">Flotilla</button>
        <button data-tab="alertas">Alertas <span id="contAlertas"></span></button>
      </div>

      <div class="panel-lista activo" id="panelVehiculos">
        <div class="vacio">Cargando flotilla...</div>
      </div>

      <div class="panel-lista" id="panelAlertas">
        <div class="vacio">Cargando alertas...</div>
      </div>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="auth.js"></script>
<script>
  let mapa, marcadores = {};

  FlotillaAuth.proteger({ roles: ['admin', 'dispatcher'] }).then(function (usuario) {
    document.getElementById('badgeUsuario').textContent = usuario.Nombre + ' · ' + usuario.Rol;
    if (usuario.Rol === 'admin') document.getElementById('linkAdmin').style.display = 'inline-block';

    iniciarMapa();
    cargarFlotilla();
    cargarAlertas();

    setInterval(cargarFlotilla, 5000);
    setInterval(cargarAlertas, 8000);
  });

  function iniciarMapa() {
    mapa = L.map('mapa').setView([31.8667, -116.5964], 12); // Ensenada, BC por defecto
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);
  }

  function iconoPorEstado(estado) {
    const color = estado === 'averia' ? '#e05a4e' : estado === 'detenido' ? '#e0a53c' : '#35c2a4';
    return L.divIcon({
      className: '',
      html: '<div style="width:16px;height:16px;border-radius:50%;background:' + color + ';border:2px solid #0b1420;box-shadow:0 0 0 2px ' + color + '55;"></div>',
      iconSize: [16, 16]
    });
  }

  function cargarFlotilla() {
    FlotillaAuth.llamarGet('listarFlotilla').then(function (res) {
      if (!res.exito) return;
      renderizarVehiculos(res.datos);
      actualizarMarcadores(res.datos);
    });
  }

  function renderizarVehiculos(lista) {
    const panel = document.getElementById('panelVehiculos');
    if (!lista.length) {
      panel.innerHTML = '<div class="vacio">Ningún vehículo ha reportado ubicación todavía.</div>';
      return;
    }
    panel.innerHTML = lista.map(function (v) {
      const hace = tiempoRelativo(v.Timestamp);
      return '<div class="item-vehiculo" onclick="centrarEn(' + v.Lat + ',' + v.Lng + ')">' +
        '<div class="nombre"><span class="estado-punto ' + v.Estado + '"></span>' + escapeHtml(v.Nombre) + '</div>' +
        '<div class="meta">' + Math.round(v.Velocidad || 0) + ' km/h · ' + hace + '</div></div>';
    }).join('');
  }

  function actualizarMarcadores(lista) {
    lista.forEach(function (v) {
      if (!v.Lat || !v.Lng) return;
      if (marcadores[v.UsuarioID]) {
        marcadores[v.UsuarioID].setLatLng([v.Lat, v.Lng]);
        marcadores[v.UsuarioID].setIcon(iconoPorEstado(v.Estado));
      } else {
        marcadores[v.UsuarioID] = L.marker([v.Lat, v.Lng], { icon: iconoPorEstado(v.Estado) })
          .addTo(mapa)
          .bindPopup(escapeHtml(v.Nombre));
      }
    });
  }

  function centrarEn(lat, lng) {
    mapa.setView([lat, lng], 15);
  }

  function cargarAlertas() {
    FlotillaAuth.llamarGet('listarAlertas').then(function (res) {
      if (!res.exito) return;
      renderizarAlertas(res.datos);
    });
  }

  function renderizarAlertas(lista) {
    const panel = document.getElementById('panelAlertas');
    const pendientes = lista.filter(function (a) { return !a.Atendida; });
    document.getElementById('contAlertas').textContent = pendientes.length ? '(' + pendientes.length + ')' : '';

    if (!lista.length) {
      panel.innerHTML = '<div class="vacio">Sin alertas registradas.</div>';
      return;
    }

    panel.innerHTML = lista.slice(0, 30).map(function (a) {
      return '<div class="item-alerta ' + (a.Atendida ? 'atendida' : '') + '">' +
        '<div class="tipo">' + escapeHtml(a.Tipo) + '</div>' +
        '<div class="nombre">' + escapeHtml(a.Nombre) + '</div>' +
        (a.Mensaje ? '<div class="msg">' + escapeHtml(a.Mensaje) + '</div>' : '') +
        '<div class="meta" style="font-size:11px;color:#8ea3b8;margin-top:3px;">' + tiempoRelativo(a.Timestamp) + '</div>' +
        (!a.Atendida ? '<button onclick="atender(\'' + a.ID + '\')">Marcar atendida</button>' : '') +
        '</div>';
    }).join('');
  }

  function atender(id) {
    FlotillaAuth.llamar('atenderAlerta', { id: id }).then(function () { cargarAlertas(); });
  }

  document.querySelectorAll('.aside-tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.aside-tabs button').forEach(function (b) { b.classList.remove('activo'); });
      document.querySelectorAll('.panel-lista').forEach(function (p) { p.classList.remove('activo'); });
      btn.classList.add('activo');
      document.getElementById('panel' + (btn.dataset.tab === 'vehiculos' ? 'Vehiculos' : 'Alertas')).classList.add('activo');
    });
  });

  function tiempoRelativo(fechaStr) {
    const diffSeg = Math.floor((Date.now() - new Date(fechaStr).getTime()) / 1000);
    if (diffSeg < 60) return 'hace ' + diffSeg + 's';
    if (diffSeg < 3600) return 'hace ' + Math.floor(diffSeg / 60) + 'min';
    return 'hace ' + Math.floor(diffSeg / 3600) + 'h';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
