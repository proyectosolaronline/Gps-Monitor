<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flotilla GPS Pro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f172a; --panel:#111827; --panel2:#1f2937; --accent:#22c55e;
    --accent2:#3b82f6; --danger:#ef4444; --warn:#f59e0b; --text:#e5e7eb; --muted:#94a3b8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); overflow:hidden;}

  /* ---------- LOGIN ---------- */
  #loginOverlay{
    position:fixed; inset:0; background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;
  }
  #loginBox{
    background:var(--panel); border-radius:16px; padding:32px 28px; width:100%; max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #loginBox h1{font-size:22px; margin-bottom:4px; text-align:center;}
  #loginBox p.sub{color:var(--muted); text-align:center; font-size:13px; margin-bottom:24px;}
  #loginBox input{
    width:100%; padding:12px 14px; margin-bottom:12px; border-radius:10px; border:1px solid #334155;
    background:var(--panel2); color:var(--text); font-size:14px;
  }
  #loginBox button{
    width:100%; padding:13px; border:none; border-radius:10px; background:var(--accent);
    color:#04140a; font-weight:700; font-size:15px; cursor:pointer; margin-top:8px;
  }
  #loginBox button:active{transform:scale(.98);}
  #loginError{color:var(--danger); font-size:13px; text-align:center; margin-top:10px; min-height:16px;}

  /* ---------- APP ---------- */
  #app{display:none; height:100vh; flex-direction:column;}
  header{
    background:var(--panel); padding:12px 16px; display:flex; align-items:center;
    justify-content:space-between; z-index:500; box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  header .title{font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px;}
  header .userinfo{font-size:12px; color:var(--muted); text-align:right;}
  header button.logout{
    background:none; border:1px solid #334155; color:var(--text); padding:6px 10px;
    border-radius:8px; font-size:12px; margin-left:10px; cursor:pointer;
  }

  #mapContainer{flex:1; position:relative;}
  #map{height:100%; width:100%;}

  /* Barra de dirección */
  #addressBar{
    position:absolute; top:10px; left:10px; right:10px; z-index:400;
    background:rgba(17,24,39,.92); backdrop-filter:blur(4px); padding:10px 14px;
    border-radius:10px; font-size:13px; display:flex; align-items:center; gap:8px;
  }
  #addressBar .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0;}

  /* Velocímetro */
  #speedo{
    position:absolute; bottom:90px; right:14px; z-index:400; background:rgba(17,24,39,.92);
    border-radius:14px; padding:14px 18px; text-align:center; min-width:90px;
  }
  #speedo .val{font-size:28px; font-weight:800; line-height:1;}
  #speedo .unit{font-size:11px; color:var(--muted);}

  /* Botones flotantes */
  #fabs{position:absolute; bottom:90px; left:14px; z-index:400; display:flex; flex-direction:column; gap:10px;}
  .fab{
    width:50px; height:50px; border-radius:50%; background:var(--panel2); border:1px solid #334155;
    display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;
    position:relative;
  }
  .fab .badge{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:10px;
    font-weight:700; border-radius:10px; min-width:18px; height:18px; display:flex; align-items:center;
    justify-content:center; padding:0 4px;
  }

  /* Bottom nav */
  nav#bottomNav{
    background:var(--panel); display:flex; z-index:500; border-top:1px solid #1f2937;
  }
  nav#bottomNav button{
    flex:1; background:none; border:none; color:var(--muted); padding:10px 0; font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  }
  nav#bottomNav button.active{color:var(--accent);}
  nav#bottomNav .icon{font-size:18px;}

  /* Paneles deslizables (Chat / Flotilla / Alertas) */
  .panel{
    position:fixed; left:0; right:0; bottom:0; height:70%; background:var(--panel);
    border-radius:18px 18px 0 0; z-index:800; display:none; flex-direction:column;
    box-shadow:0 -10px 40px rgba(0,0,0,.5); transform:translateY(100%); transition:transform .25s ease;
  }
  .panel.open{display:flex; transform:translateY(0);}
  .panel-header{
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid #1f2937;
  }
  .panel-header h2{font-size:16px;}
  .panel-header .close{background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer;}
  .panel-body{flex:1; overflow-y:auto; padding:12px 16px;}

  /* Chat */
  .chat-msg{margin-bottom:10px; max-width:80%;}
  .chat-msg.mine{margin-left:auto; text-align:right;}
  .chat-msg .bubble{
    display:inline-block; padding:8px 12px; border-radius:12px; background:var(--panel2); font-size:13px;
  }
  .chat-msg.mine .bubble{background:var(--accent2); color:#fff;}
  .chat-msg.alerta .bubble{background:var(--danger); color:#fff;}
  .chat-msg .meta{font-size:10px; color:var(--muted); margin-top:2px;}
  #chatInputRow{
    display:flex; gap:8px; padding:10px 16px; border-top:1px solid #1f2937; align-items:center;
  }
  #chatInputRow input{
    flex:1; padding:11px 14px; border-radius:20px; border:1px solid #334155; background:var(--panel2);
    color:var(--text); font-size:14px;
  }
  #chatInputRow button{
    background:var(--accent); border:none; width:42px; height:42px; border-radius:50%; font-size:16px; cursor:pointer;
  }
  #chatInputRow .sos{background:var(--danger); color:#fff;}

  /* Flotilla list */
  .veh-card{
    background:var(--panel2); border-radius:12px; padding:12px 14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .veh-card .name{font-weight:700; font-size:14px;}
  .veh-card .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .status-dot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px;}
  .status-dot.activo{background:var(--accent);}
  .status-dot.detenido{background:var(--warn);}
  .status-dot.averia{background:var(--danger);}

  /* Alertas */
  .alert-card{
    background:var(--panel2); border-left:3px solid var(--danger); border-radius:8px;
    padding:10px 12px; margin-bottom:8px; font-size:13px;
  }
  .alert-card .meta{font-size:10px; color:var(--muted); margin-top:4px;}
  .alert-card.leida{opacity:.5; border-left-color:#334155;}

  /* Toast */
  #toastContainer{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:2000; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:var(--panel2); padding:10px 18px; border-radius:10px; font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.4); animation:fadein .2s ease;
  }
  @keyframes fadein{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

  /* Vehículo marker */
  .veh-icon{
    background:var(--accent2); color:#fff; border-radius:50%; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; font-size:16px; border:2px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .veh-icon.mia{background:var(--accent);}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginOverlay">
  <div id="loginBox">
    <h1>🚛 Flotilla GPS Pro</h1>
    <p class="sub">Ingresa con tu cuenta</p>
    <input type="email" id="inpUsuario" placeholder="Correo electrónico" autocomplete="username">
    <input type="password" id="inpPassword" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="hacerLogin()">Ingresar</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="title">🚛 Flotilla GPS Pro</div>
    <div style="display:flex; align-items:center;">
      <div class="userinfo">
        <div id="hNombre"></div>
        <div id="hRol" style="text-transform:capitalize;"></div>
      </div>
      <button class="logout" onclick="cerrarSesion()">Salir</button>
    </div>
  </header>

  <div id="mapContainer">
    <div id="map"></div>

    <div id="addressBar">
      <div class="dot"></div>
      <div id="addressText">Obteniendo ubicación…</div>
    </div>

    <div id="speedo">
      <div class="val" id="speedVal">0</div>
      <div class="unit">km/h</div>
    </div>

    <div id="fabs">
      <div class="fab" onclick="abrirPanel('flotilla')">🚚
        <span class="badge" id="badgeFlotilla" style="display:none;"></span>
      </div>
      <div class="fab" onclick="abrirPanel('alertas')">🔔
        <span class="badge" id="badgeAlertas" style="display:none;"></span>
      </div>
    </div>
  </div>

  <nav id="bottomNav">
    <button class="active" onclick="centrarMapa()"><span class="icon">📍</span>Mi ubicación</button>
    <button onclick="abrirPanel('flotilla')"><span class="icon">🚚</span>Flotilla</button>
    <button onclick="abrirPanel('chat')"><span class="icon">💬</span>Chat</button>
    <button onclick="abrirPanel('alertas')"><span class="icon">🔔</span>Alertas</button>
  </nav>
</div>

<!-- ============ PANEL: CHAT ============ -->
<div class="panel" id="panelChat">
  <div class="panel-header">
    <h2>💬 Chat global</h2>
    <button class="close" onclick="cerrarPanel('chat')">×</button>
  </div>
  <div class="panel-body" id="chatBody"></div>
  <div id="chatInputRow">
    <button class="sos" onclick="enviarSOS()">🆘</button>
    <input type="text" id="chatInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') enviarChat()">
    <button onclick="enviarChat()">➤</button>
  </div>
</div>

<!-- ============ PANEL: FLOTILLA ============ -->
<div class="panel" id="panelFlotilla">
  <div class="panel-header">
    <h2>🚚 Flotilla</h2>
    <button class="close" onclick="cerrarPanel('flotilla')">×</button>
  </div>
  <div class="panel-body" id="flotillaBody"></div>
</div>

<!-- ============ PANEL: ALERTAS ============ -->
<div class="panel" id="panelAlertas">
  <div class="panel-header">
    <h2>🔔 Alertas</h2>
    <button class="close" onclick="cerrarPanel('alertas')">×</button>
  </div>
  <div class="panel-body" id="alertasBody"></div>
</div>

<div id="toastContainer"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxN9_j4DAE0I6jw1S__8B7Amjjw8bFSFTkXSPNEe80JQE4B6X2r_RTLebLGhfr93o6PFg/exec'; // ej. https://script.google.com/macros/s/XXXX/exec

let sesion = null;
let map, miMarcador, watcherId;
let marcadoresFlotilla = {};
let ultimoEnvio = 0;
let ultimaDireccion = '';
let chatPollInterval, flotillaPollInterval, alertasPollInterval;
let ultimoTimestampChat = null;

// ============================================================
// LOGIN
// ============================================================
function hacerLogin() {
  const usuario = document.getElementById('inpUsuario').value.trim();
  const password = document.getElementById('inpPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';

  if (!usuario || !password) {
    errorEl.textContent = 'Completa usuario y contraseña';
    return;
  }

  const url = `${API_URL}?tipo=login&usuario=${encodeURIComponent(usuario)}&password=${encodeURIComponent(password)}`;

  fetch(url)
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        sesion = res.data;
        sessionStorage.setItem('flotilla_sesion', JSON.stringify(sesion));
        iniciarApp();
      } else {
        errorEl.textContent = res.mensaje || 'Error al iniciar sesión';
      }
    })
    .catch(() => { errorEl.textContent = '❌ No se pudo conectar al servidor'; });
}

function cerrarSesion() {
  sessionStorage.removeItem('flotilla_sesion');
  clearInterval(chatPollInterval);
  clearInterval(flotillaPollInterval);
  clearInterval(alertasPollInterval);
  if (watcherId) navigator.geolocation.clearWatch(watcherId);
  location.reload();
}

// Restaurar sesión si existe
window.addEventListener('load', () => {
  const guardada = sessionStorage.getItem('flotilla_sesion');
  if (guardada) {
    sesion = JSON.parse(guardada);
    iniciarApp();
  }
});

// ============================================================
// INICIAR APP
// ============================================================
function iniciarApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('hNombre').textContent = sesion.nombre;
  document.getElementById('hRol').textContent = sesion.rol;

  initMap();
  iniciarGPS();
  cargarFlotilla();
  cargarChat();
  cargarAlertas();

  flotillaPollInterval = setInterval(cargarFlotilla, 5000);
  chatPollInterval = setInterval(cargarChat, 4000);
  alertasPollInterval = setInterval(cargarAlertas, 8000);
}

// ============================================================
// MAPA
// ============================================================
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([19.4326, -99.1332], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
}

function centrarMapa() {
  if (miMarcador) map.setView(miMarcador.getLatLng(), 16);
}

// ============================================================
// GPS
// ============================================================
function iniciarGPS() {
  if (!navigator.geolocation) {
    mostrarToast('❌ Geolocalización no disponible en este dispositivo');
    return;
  }

  watcherId = navigator.geolocation.watchPosition(onGPSUpdate, onGPSError, {
    enableHighAccuracy: true, maximumAge: 2000, timeout: 10000
  });
}

function onGPSError(err) {
  mostrarToast('⚠️ Error de GPS: ' + err.message);
}

function onGPSUpdate(pos) {
  const { latitude, longitude, speed, heading } = pos.coords;
  const velocidadKmh = speed ? Math.round(speed * 3.6) : 0;
  const direccion = gradosADireccion(heading);

  document.getElementById('speedVal').textContent = velocidadKmh;

  // Marcador propio
  if (!miMarcador) {
    const icon = L.divIcon({ className: '', html: '<div class="veh-icon mia">🚛</div>', iconSize: [34, 34] });
    miMarcador = L.marker([latitude, longitude], { icon }).addTo(map);
    map.setView([latitude, longitude], 16);
  } else {
    miMarcador.setLatLng([latitude, longitude]);
  }

  // Actualizar barra de dirección cada 5 min o si cambió mucho
  actualizarDireccionTexto(latitude, longitude);

  // Enviar ubicación al servidor cada 3s
  const ahora = Date.now();
  if (ahora - ultimoEnvio > 3000 && sesion.vehiculo && sesion.vehiculo !== '-') {
    ultimoEnvio = ahora;
    enviarUbicacion(latitude, longitude, velocidadKmh, direccion);
  }
}

function gradosADireccion(deg) {
  if (deg === null || deg === undefined) return '';
  const dirs = ['Norte', 'Noreste', 'Este', 'Sureste', 'Sur', 'Suroeste', 'Oeste', 'Noroeste'];
  return dirs[Math.round(deg / 45) % 8];
}

function enviarUbicacion(lat, lng, velocidad, direccion) {
  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'ubicacion', id: sesion.vehiculo, lat, lng, velocidad, direccion })
  }).catch(() => {});
}

// ---- Barra de dirección (reverse geocoding, cada 5 min) ----
let ultimaConsultaDireccion = 0;
function actualizarDireccionTexto(lat, lng) {
  const ahora = Date.now();
  if (ahora - ultimaConsultaDireccion < 5 * 60 * 1000) return;
  ultimaConsultaDireccion = ahora;

  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
    .then(r => r.json())
    .then(data => {
      const dir = data.display_name || 'Ubicación desconocida';
      ultimaDireccion = dir;
      document.getElementById('addressText').textContent = dir;
    })
    .catch(() => {
      document.getElementById('addressText').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    });
}

// ============================================================
// FLOTILLA EN EL MAPA
// ============================================================
function cargarFlotilla() {
  fetch(`${API_URL}?action=flotilla`)
    .then(r => r.json())
    .then(res => {
      if (!res.success) return;
      renderFlotillaMapa(res.data);
      renderFlotillaPanel(res.data);
    })
    .catch(() => {});
}

function renderFlotillaMapa(vehiculos) {
  vehiculos.forEach(v => {
    if (v.id === sesion.vehiculo) return; // el propio ya se dibuja con GPS del navegador
    if (!v.lat || !v.lng) return;

    const emoji = v.estado === 'averia' ? '🛑' : v.estado === 'detenido' ? '🟡' : '🚚';
    if (marcadoresFlotilla[v.id]) {
      marcadoresFlotilla[v.id].setLatLng([v.lat, v.lng]);
    } else {
      const icon = L.divIcon({ className: '', html: `<div class="veh-icon">${emoji}</div>`, iconSize: [34, 34] });
      marcadoresFlotilla[v.id] = L.marker([v.lat, v.lng], { icon }).addTo(map)
        .bindPopup(`<b>${v.id}</b><br>${v.conductor}<br>${v.velocidad} km/h`);
    }
  });
}

function renderFlotillaPanel(vehiculos) {
  const cont = document.getElementById('flotillaBody');
  cont.innerHTML = '';
  vehiculos.forEach(v => {
    const div = document.createElement('div');
    div.className = 'veh-card';
    div.innerHTML = `
      <div>
        <div class="name"><span class="status-dot ${v.estado}"></span>${v.id} — ${v.conductor}</div>
        <div class="sub">${v.velocidad} km/h · ${v.direccion || '—'} · ${v.estado}</div>
      </div>
    `;
    div.onclick = () => {
      if (v.lat && v.lng) { map.setView([v.lat, v.lng], 16); cerrarPanel('flotilla'); }
    };
    cont.appendChild(div);
  });
}

// ============================================================
// CHAT
// ============================================================
function cargarChat() {
  fetch(`${API_URL}?action=chat`)
    .then(r => r.json())
    .then(res => {
      if (!res.success) return;
      renderChat(res.data);
    })
    .catch(() => {});
}

function renderChat(mensajes) {
  const cont = document.getElementById('chatBody');
  const estabaAbajo = cont.scrollTop + cont.clientHeight >= cont.scrollHeight - 30;

  cont.innerHTML = '';
  mensajes.forEach(m => {
    const mio = m.usuario === sesion.nombre;
    const div = document.createElement('div');
    div.className = 'chat-msg' + (mio ? ' mine' : '') + (m.tipo === 'alerta' ? ' alerta' : '');
    div.innerHTML = `
      <div class="bubble">${escapeHtml(m.mensaje)}</div>
      <div class="meta">${m.usuario} · ${m.vehiculo} · ${formatHora(m.timestamp)}</div>
    `;
    cont.appendChild(div);
  });

  if (estabaAbajo || mensajes.length < 20) cont.scrollTop = cont.scrollHeight;
}

function enviarChat() {
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  if (!texto) return;
  input.value = '';
  postMensaje(texto, 'normal');
}

function enviarSOS() {
  postMensaje('🆘 Necesito ayuda', 'alerta');
}

function postMensaje(mensaje, tipo) {
  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'mensaje', usuario: sesion.nombre, vehiculo: sesion.vehiculo, mensaje, tipo })
  }).then(cargarChat).catch(() => mostrarToast('❌ No se pudo enviar el mensaje'));
}

// ============================================================
// ALERTAS
// ============================================================
function cargarAlertas() {
  fetch(`${API_URL}?action=alertas&usuario=${encodeURIComponent(sesion.usuario)}`)
    .then(r => r.json())
    .then(res => {
      if (!res.success) return;
      renderAlertas(res.data);
    })
    .catch(() => {});
}

function renderAlertas(alertas) {
  const cont = document.getElementById('alertasBody');
  cont.innerHTML = '';
  let noLeidas = 0;

  alertas.slice().reverse().forEach(a => {
    if (!a.leida) noLeidas++;
    const div = document.createElement('div');
    div.className = 'alert-card' + (a.leida ? ' leida' : '');
    div.innerHTML = `
      <div>${escapeHtml(a.mensaje)}</div>
      <div class="meta">${a.idVehiculo} · ${formatHora(a.timestamp)}</div>
    `;
    if (!a.leida) {
      div.onclick = () => {
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'marcar_leido', timestamp: a.timestamp, vehiculo: a.idVehiculo })
        }).then(cargarAlertas);
      };
    }
    cont.appendChild(div);
  });

  const badge = document.getElementById('badgeAlertas');
  if (noLeidas > 0) { badge.style.display = 'flex'; badge.textContent = noLeidas; }
  else badge.style.display = 'none';
}

// ============================================================
// PANELES
// ============================================================
function abrirPanel(nombre) {
  document.getElementById('panel' + capitalize(nombre)).classList.add('open');
}
function cerrarPanel(nombre) {
  document.getElementById('panel' + capitalize(nombre)).classList.remove('open');
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ============================================================
// UTILIDADES
// ============================================================
function mostrarToast(msg) {
  const cont = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  cont.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatHora(ts) {
  if (!ts) return '';
  const partes = String(ts).split(' ');
  return partes[1] ? partes[1].slice(0, 5) : ts;
}
