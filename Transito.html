<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flotilla GPS Pro — Tránsito</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0b1420; --panel:#101c2c; --line:#223449;
    --text:#e8eef5; --text-dim:#8ea3b8; --accent:#35c2a4; --danger:#e05a4e; --warn:#e0a53c;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,-apple-system,sans-serif; }

  #app{ display:flex; flex-direction:column; height:100vh; }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    padding: 12px 16px; border-bottom:1px solid var(--line); background: var(--panel); z-index:10;
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(53,194,164,0.15); }
  .brand h1{ font-size:14px; margin:0; }
  nav{ display:flex; gap:8px; align-items:center; }
  nav a, nav button{
    text-decoration:none; color:var(--text); background:transparent; border:1px solid var(--line);
    padding:7px 12px; border-radius:7px; font-size:12px; cursor:pointer;
  }

  main{ flex:1; position:relative; min-height:0; }
  #mapa{ position:absolute; inset:0; }

  .hud{
    position:absolute; left:12px; bottom:12px; z-index: 400;
    display:flex; flex-direction:column; gap:8px;
  }
  .velocimetro{
    background: rgba(16,28,44,0.92); border:1px solid var(--line); border-radius:12px;
    padding: 14px 18px; text-align:center; min-width: 110px;
    backdrop-filter: blur(4px);
  }
  .velocimetro .valor{ font-size:30px; font-weight:800; color: var(--accent); line-height:1; }
  .velocimetro .unidad{ font-size:10px; color: var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:4px; }

  .direccion{
    background: rgba(16,28,44,0.92); border:1px solid var(--line); border-radius:10px;
    padding: 9px 14px; font-size:12px; color: var(--text-dim); max-width: 240px;
    backdrop-filter: blur(4px);
  }

  .sos-btn{
    position:absolute; right:14px; bottom:14px; z-index:400;
    width:64px; height:64px; border-radius:50%; background: var(--danger);
    color:#fff; border:none; font-weight:800; font-size:13px; cursor:pointer;
    box-shadow: 0 0 0 6px rgba(224,90,78,0.18);
  }
  .sos-btn:active{ transform: scale(0.95); }

  .estado-select{
    position:absolute; top:12px; left:12px; z-index:400;
    background: rgba(16,28,44,0.92); border:1px solid var(--line); border-radius:9px;
    padding: 8px 10px; backdrop-filter: blur(4px);
  }
  .estado-select select{
    background:none; border:none; color: var(--text); font-size:12.5px; outline:none;
  }

  #toast{
    position: fixed; bottom: 20px; left:50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    padding: 12px 18px; border-radius:8px; font-size:13px; opacity:0; transition: all 0.25s ease;
    pointer-events:none; z-index: 999;
  }
  #toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
  #toast.error{ border-left-color: var(--danger); }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand"><div class="dot"></div><h1 id="tituloUsuario">Tránsito</h1></div>
    <nav>
      <a href="Chat.html">Chat</a>
      <button onclick="FlotillaAuth.cerrarSesion()">Salir</button>
    </nav>
  </header>

  <main>
    <div id="mapa"></div>

    <div class="estado-select">
      <select id="selectEstado" onchange="cambiarEstado()">
        <option value="activo">🟢 Activo</option>
        <option value="detenido">🟡 Detenido</option>
        <option value="averia">🔴 Avería</option>
      </select>
    </div>

    <div class="hud">
      <div class="velocimetro">
        <div class="valor" id="valorVelocidad">0</div>
        <div class="unidad">km/h</div>
      </div>
      <div class="direccion" id="direccionActual">Obteniendo ubicación...</div>
    </div>

    <button class="sos-btn" onclick="enviarSOS()">SOS</button>
  </main>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="auth.js"></script>
<script>
  let mapa, marcadorPropio, marcadoresFlotilla = {};
  let estadoActual = 'activo';
  let ultimaPosicion = null;
  let ultimoGuardadoRuta = 0;

  FlotillaAuth.proteger().then(function (usuario) {
    document.getElementById('tituloUsuario').textContent = usuario.Nombre;
    iniciarMapa();
    iniciarGPS();
    cargarFlotilla();
    setInterval(cargarFlotilla, 6000);
  });

  function iniciarMapa() {
    mapa = L.map('mapa').setView([31.8667, -116.5964], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);
  }

  function iniciarGPS() {
    if (!navigator.geolocation) {
      mostrarToast('Este dispositivo no soporta GPS.', true);
      return;
    }

    navigator.geolocation.watchPosition(function (pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const velocidadKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;

      ultimaPosicion = { lat: lat, lng: lng };
      document.getElementById('valorVelocidad').textContent = velocidadKmh;

      if (!marcadorPropio) {
        marcadorPropio = L.marker([lat, lng]).addTo(mapa);
        mapa.setView([lat, lng], 16);
      } else {
        marcadorPropio.setLatLng([lat, lng]);
      }

      FlotillaAuth.llamar('actualizarUbicacion', { lat: lat, lng: lng, velocidad: velocidadKmh, estado: estadoActual });

      // Guarda un punto de ruta cada ~5 minutos
      const ahora = Date.now();
      if (ahora - ultimoGuardadoRuta > 5 * 60 * 1000) {
        ultimoGuardadoRuta = ahora;
        FlotillaAuth.llamar('guardarPuntoRuta', { lat: lat, lng: lng });
      }

      actualizarDireccion(lat, lng);
    }, function (err) {
      mostrarToast('No se pudo obtener tu ubicación: ' + err.message, true);
    }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 8000 });
  }

  function actualizarDireccion(lat, lng) {
    fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng)
      .then(function (r) { return r.json(); })
      .then(function (res) {
        document.getElementById('direccionActual').textContent = res.display_name || 'Dirección no disponible';
      })
      .catch(function () {});
  }

  function cambiarEstado() {
    estadoActual = document.getElementById('selectEstado').value;
    if (ultimaPosicion) {
      FlotillaAuth.llamar('actualizarUbicacion', {
        lat: ultimaPosicion.lat, lng: ultimaPosicion.lng, estado: estadoActual
      });
    }
  }

  function cargarFlotilla() {
    FlotillaAuth.llamarGet('listarFlotilla').then(function (res) {
      if (!res.exito) return;
      const usuario = FlotillaAuth.obtenerUsuario();

      res.datos.forEach(function (v) {
        if (usuario && v.UsuarioID === usuario.ID) return; // no duplicar el propio marcador
        if (!v.Lat || !v.Lng) return;

        if (marcadoresFlotilla[v.UsuarioID]) {
          marcadoresFlotilla[v.UsuarioID].setLatLng([v.Lat, v.Lng]);
        } else {
          marcadoresFlotilla[v.UsuarioID] = L.marker([v.Lat, v.Lng], {
            icon: L.divIcon({
              className: '',
              html: '<div style="width:13px;height:13px;border-radius:50%;background:#8ea3b8;border:2px solid #0b1420;"></div>',
              iconSize: [13, 13]
            })
          }).addTo(mapa).bindPopup(v.Nombre);
        }
      });
    });
  }

  function enviarSOS() {
    if (!confirm('¿Enviar alerta de emergencia SOS al monitor?')) return;

    FlotillaAuth.llamar('enviarAlerta', {
      tipo: 'SOS',
      mensaje: 'Alerta enviada manualmente desde tránsito.',
      lat: ultimaPosicion ? ultimaPosicion.lat : '',
      lng: ultimaPosicion ? ultimaPosicion.lng : ''
    }).then(function (res) {
      mostrarToast(res.exito ? 'Alerta SOS enviada.' : (res.mensaje || 'Error al enviar alerta.'), !res.exito);
    });
  }

  function mostrarToast(mensaje, esError) {
    const toast = document.getElementById('toast');
    toast.textContent = mensaje;
    toast.className = esError ? 'show error' : 'show';
    setTimeout(function () { toast.className = ''; }, 3500);
  }
</script>

</body>
</html>
